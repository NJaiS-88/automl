# Repo root must contain `backend/`, `streamlit_tailored_app/`, this file, etc.
# Docs: https://render.com/docs/infrastructure-as-code
#
# Required env vars (set in Render dashboard — do not commit secrets):
#   MONGODB_URI, JWT_SECRET, CLIENT_URL
#
# Optional:
#   PUBLIC_BASE_URL  — public https URL of this service (Render injects RENDER_EXTERNAL_URL
#                      automatically; only set PUBLIC_BASE_URL if you need a custom domain).
#   DATA_DIR         — mount path for a persistent disk (Render paid add-on) so
#                      uploads/ and generated/ survive restarts.
#   PYTHON_EXECUTABLE — override Python binary path. On Render with PYTHON_VERSION set,
#                       `python3` is auto-resolved; only set if you need a specific venv.
services:
  - type: web
    name: automl-backend
    runtime: node
    rootDir: backend
    buildCommand: |
      npm ci
      python -m pip install --no-cache-dir -r requirements.txt
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATA_DIR
        sync: false
